name: Bug report
description: Report a reproducible problem in this example.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include runtime version and a small, synthetic reproduction. Never include credentials or customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Offline check output
      description: Paste only redacted errors.
