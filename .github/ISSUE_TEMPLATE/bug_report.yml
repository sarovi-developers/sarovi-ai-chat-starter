name: گزارش خطا
description: گزارش یک مشکل قابل بازتولید در این نمونه.
body:
  - type: textarea
    id: problem
    attributes:
      label: چه اتفاقی افتاد؟
      description: نسخهٔ محیط اجرا و یک نمونهٔ کوچک با دادهٔ ساختگی را بنویسید. کلید یا اطلاعات مشتری را وارد نکنید.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: انتظار چه نتیجه‌ای داشتید؟
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: نتیجهٔ آزمون آفلاین
      description: فقط خطاهای بدون اطلاعات خصوصی را وارد کنید.
